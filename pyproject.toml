[project]
name = "rag-forge"
version = "0.1.0"
description = "Pluggable hybrid-retrieval RAG engine: BM25 x dense, RRF fusion, MMR rerank, offline eval"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
models = ["sentence-transformers>=2.2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_forge"]
